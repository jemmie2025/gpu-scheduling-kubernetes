apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-dedicated
spec:
  template:
    metadata:
      labels:
        gpu.example.com/pool: dedicated
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-node-class
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - g5
            - g6
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5ms