apiVersion: v1
kind: Pod
metadata:
  name: gpu-mig-test
  namespace: default
  labels:
    app: gpu-validation
    gpu-mode: mig
spec:
  restartPolicy: Never
  nodeSelector:
    gpu.example.com/pool: mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: gpu-test
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command:
        - /bin/bash
        - -lc
        - "nvidia-smi && sleep 3600"
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
          nvidia.com/mig-1g.10gb: 1
        limits:
          cpu: "1"
          memory: "1Gi"
          nvidia.com/mig-1g.10gb: 1
